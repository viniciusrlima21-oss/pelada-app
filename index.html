<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelada Toque de Classe</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: header fixo + grade de cards em colunas responsivas */
:root {
  --navy: #1a2d5a;
  --navy-mid: #243d7a;
  --gold: #c9a228;
  --gold-lt: #e8c547;
  --bg: #f2f4f9;
  --surface: #ffffff;
  --txt: #1a1f2e;
  --txt-mid: #4a5068;
  --txt-dim: #8891a8;
  --border: #e0e3ef;
  --shadow: 0 2px 12px rgba(26,45,90,.10);
  --shadow-lg: 0 8px 32px rgba(26,45,90,.18);
  --radius: 10px;
  --pos-gk: #c8980a;
  --pos-zag: #7030c0;
  --pos-lat: #2060c8;
  --pos-mei: #20a060;
  --pos-ata: #c04020;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #161d30; --txt: #e8ecf5; --txt-mid: #9aa3bf;
    --txt-dim: #5a6382; --border: #242d48; --shadow: 0 2px 12px rgba(0,0,0,.35);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #161d30; --txt: #e8ecf5; --txt-mid: #9aa3bf;
  --txt-dim: #5a6382; --border: #242d48; --shadow: 0 2px 12px rgba(0,0,0,.35);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.5); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--txt);
  font-family: 'Barlow', system-ui, sans-serif; font-size: 15px;
  padding-left: max(0px, env(safe-area-inset-left,0px));
  padding-right: max(0px, env(safe-area-inset-right,0px));
}
img { max-width: 100%; display: block; }
button { cursor: pointer; font-family: inherit; }
[hidden] { display: none !important; }

/* ── HEADER ──────────────────────────────────────────────── */
.site-header {
  background: var(--navy);
  padding: 0 max(16px, env(safe-area-inset-left,0px));
  display: flex; align-items: center; gap: 14px;
  min-height: 100px; position: sticky; top: env(safe-area-inset-top,0px);
  z-index: 50;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top,0px); background: var(--navy); z-index: 100;
}
.header-logo {
  width: 90px; height: 90px; flex-shrink: 0;
  position: relative;
}
.header-logo::before {
  content: "";
  position: absolute; inset: -4px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--gold), #fff8dc, var(--gold), #c9a228, var(--gold));
  animation: shield-spin 4s linear infinite;
  opacity: .7;
  z-index: 0;
}
.header-logo::after {
  content: "";
  position: absolute; inset: 2px;
  border-radius: 50%;
  background: var(--navy);
  z-index: 1;
}
.header-logo img {
  position: relative; z-index: 2;
  width: 100%; height: 100%; object-fit: contain;
  filter: drop-shadow(0 0 12px rgba(201,162,40,.8)) drop-shadow(0 2px 4px rgba(0,0,0,.6));
}
@keyframes shield-spin { to { transform: rotate(360deg); } }
.header-text { flex: 1; min-width: 0; }
.header-title {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
  font-size: 20px; color: #fff; letter-spacing: .5px; text-transform: uppercase;
  line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-sub {
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
  color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px;
}
.btn-admin {
  background: none; border: 1.5px solid rgba(201,162,40,.4); color: var(--gold);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px;
  letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 14px;
  border-radius: 6px; white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.btn-admin:hover { background: rgba(201,162,40,.12); border-color: var(--gold); }

/* ── FILTER BAR ─────────────────────────────────────────── */
.filter-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 max(16px, env(safe-area-inset-left,0px));
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  min-height: 52px;
}
.filter-btn {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
  background: none; color: var(--txt-mid);
  transition: all .15s;
}
.filter-btn:hover { border-color: var(--navy); color: var(--navy); }
.filter-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
.filter-search {
  margin-left: auto; padding: 7px 14px; border: 1.5px solid var(--border);
  border-radius: 20px; background: var(--bg); color: var(--txt);
  font-family: 'Barlow', sans-serif; font-size: 13px; outline: none; min-width: 160px;
  transition: border-color .15s;
}
.filter-search::placeholder { color: var(--txt-dim); }
.filter-search:focus { border-color: var(--navy); }

/* ── SECTION LABEL (position groups) ──────────────────── */
.position-section { margin: 0; }
.position-label {
  padding: 20px max(16px, env(safe-area-inset-left,0px)) 10px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--txt-dim); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.position-label::before {
  content: ""; display: block; width: 3px; height: 16px;
  background: var(--gold); border-radius: 2px; flex-shrink: 0;
}

/* ── CARDS GRID ─────────────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  padding: 16px max(16px, env(safe-area-inset-left,0px));
}
@media (max-width: 480px) { .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

/* ── PLAYER CARD ─────────────────────────────────────────── */
.player-card {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; cursor: pointer;
  transition: transform .2s, box-shadow .2s; aspect-ratio: 2/3;
  position: relative;
}
.player-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow-lg); }
.card-photo {
  width: 100%; height: 100%; object-fit: cover; object-position: top center;
  position: absolute; inset: 0;
}
.card-photo-placeholder {
  position: absolute; inset: 0; background: linear-gradient(160deg, var(--navy) 0%, #0a1428 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.card-photo-placeholder svg { opacity: .25; }
.card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(10,18,40,.95) 0%, rgba(10,18,40,.5) 45%, transparent 70%);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
}
.card-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 15px; color: #fff; text-transform: uppercase; line-height: 1.1;
  text-wrap: balance;
}
.card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.card-stars { font-size: 11px; color: var(--gold); letter-spacing: 1px; }
.pos-pill {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 10px; letter-spacing: 1px; padding: 2px 7px; border-radius: 10px;
}
.card-no-data { font-size: 11px; color: rgba(255,255,255,.4); }
.card-presence {
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
  color: rgba(255,255,255,.65); letter-spacing: .5px;
}
.score-badge {
  position: absolute; top: 7px; right: 7px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: 24px; line-height: 1;
  background: rgba(10,18,40,.82); color: #fff;
  padding: 5px 9px; border-radius: 10px; letter-spacing: 1px;
  backdrop-filter: blur(4px);
}
.score-badge.elite {
  background: var(--gold); color: #0a1228;
  box-shadow: 0 0 14px rgba(201,162,40,.75);
  font-size: 26px;
}
.player-card.elite-card { box-shadow: 0 0 0 2px var(--gold), var(--shadow); }
.player-card.elite-card:hover { box-shadow: 0 0 0 2.5px var(--gold), var(--shadow-lg); }

/* ── BOTÃO TIMES ────────────────────────────────────────── */
.btn-times {
  margin-left: auto; flex-shrink: 0;
  background: var(--gold); color: #0a1228;
  border: none; border-radius: 8px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
  font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
  padding: 7px 14px; cursor: pointer;
  transition: opacity .15s;
}
.btn-times:hover { opacity: .85; }

/* ── MODAL TIMES ─────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(5,10,22,.88); display: flex;
  align-items: flex-start; justify-content: center;
  overflow-y: auto; padding: 16px max(16px,env(safe-area-inset-left,0px));
}
.modal-box {
  background: var(--surface); border-radius: 14px;
  width: 100%; max-width: 680px;
  box-shadow: 0 8px 40px rgba(0,0,0,.6);
  overflow: hidden; margin-top: 8px;
}
.modal-hdr {
  background: var(--navy); padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-hdr h2 {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
  font-size: 20px; color: #fff; letter-spacing: .5px; margin: 0;
}
.modal-close {
  background: none; border: none; color: rgba(255,255,255,.6);
  font-size: 20px; cursor: pointer; line-height: 1; padding: 4px 8px;
}
.modal-body { padding: 16px 20px; }
.times-count {
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px;
  color: var(--gold); letter-spacing: 1px; margin-bottom: 12px;
}
.times-player-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px; max-height: 50vh; overflow-y: auto;
  padding-right: 4px; margin-bottom: 16px;
}
.times-player-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border-radius: 8px; padding: 8px 10px;
  cursor: pointer; border: 2px solid transparent;
  transition: border-color .15s, background .15s;
}
.times-player-row.selected { border-color: var(--gold); background: rgba(201,162,40,.08); }
.times-player-row input[type=checkbox] { accent-color: var(--gold); width:16px; height:16px; flex-shrink:0; }
.times-player-name { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.times-player-pos { font-size:10px; font-family:'Barlow Condensed',sans-serif; font-weight:700; padding:2px 6px; border-radius:8px; flex-shrink:0; }
.times-player-score { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:13px; color:rgba(255,255,255,.5); flex-shrink:0; }
.modal-actions { display:flex; gap:10px; flex-wrap:wrap; }
.btn-escalar {
  flex:1; background: var(--gold); color: #0a1228; border: none;
  border-radius: 8px; font-family:'Barlow Condensed',sans-serif;
  font-weight:800; font-size:15px; letter-spacing:1px;
  text-transform:uppercase; padding:12px; cursor:pointer;
  transition: opacity .15s;
}
.btn-escalar:hover { opacity:.85; }
.btn-escalar:disabled { opacity:.4; cursor:not-allowed; }
.btn-reescalar {
  background: none; border: 2px solid var(--gold); color: var(--gold);
  border-radius: 8px; font-family:'Barlow Condensed',sans-serif;
  font-weight:800; font-size:14px; letter-spacing:1px;
  text-transform:uppercase; padding:10px 20px; cursor:pointer;
  transition: background .15s;
}
.btn-reescalar:hover { background: rgba(201,162,40,.12); }

/* Times resultado */
.times-result { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
@media(max-width:480px){ .times-result { grid-template-columns:1fr; } }
.time-col { background: var(--bg); border-radius: 10px; overflow:hidden; }
.time-header {
  padding: 10px 14px;
  font-family:'Barlow Condensed',sans-serif; font-weight:800;
  font-size:16px; letter-spacing:1px; text-transform:uppercase;
  display:flex; justify-content:space-between; align-items:center;
}
.time-a .time-header { background: rgba(32,96,200,.2); color:#6090e0; }
.time-b .time-header { background: rgba(192,64,32,.2); color:#e08060; }
.time-score-total { font-size:12px; opacity:.7; }
.time-player-item {
  display:flex; align-items:center; gap:8px;
  padding:8px 14px; border-bottom:1px solid var(--border);
}
.time-player-item:last-child { border-bottom:none; }
.time-player-item-name { flex:1; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; }
.time-player-item-pos { font-size:10px; font-family:'Barlow Condensed',sans-serif; font-weight:700; padding:2px 6px; border-radius:8px; }
.time-player-item-score { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:13px; color:rgba(255,255,255,.5); }

/* ── EMPTY STATE ────────────────────────────────────────── */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--txt-dim);
  font-family: 'Barlow Condensed', sans-serif; font-size: 16px; letter-spacing: 1px;
}
.empty-state strong { display: block; font-size: 22px; color: var(--txt-mid); margin-bottom: 8px; }

/* ── FOOTER ─────────────────────────────────────────────── */
.site-footer {
  text-align: center; padding: 24px max(16px, env(safe-area-inset-left,0px));
  font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px;
  color: var(--txt-dim); border-top: 1px solid var(--border); margin-top: 20px;
}

/* ── MODAL ──────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 200; padding: 0;
}
@media (min-width: 600px) {
  .modal-overlay { align-items: center; padding: 20px; }
}
.modal-box {
  background: var(--surface); width: 100%; max-width: 520px;
  border-radius: var(--radius) var(--radius) 0 0;
  max-height: 92vh; overflow-y: auto; overflow-x: hidden;
  position: relative;
}
@media (min-width: 600px) {
  .modal-box { border-radius: var(--radius); max-height: 90vh; }
}
.modal-close {
  position: absolute; top: 12px; right: 14px; background: none;
  border: none; font-size: 22px; color: var(--txt-dim); line-height: 1; padding: 4px;
  z-index: 5; border-radius: 50%; width: 32px; height: 32px; display: flex;
  align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--border); color: var(--txt); }

/* ── PLAYER DETAIL MODAL ────────────────────────────────── */
.player-modal-photo {
  width: 100%; aspect-ratio: 3/2; object-fit: cover; object-position: top center;
  display: block; border-radius: var(--radius) var(--radius) 0 0;
}
.player-modal-photo-placeholder {
  width: 100%; aspect-ratio: 3/2;
  background: linear-gradient(160deg, var(--navy) 0%, #0a1428 100%);
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius) var(--radius) 0 0;
}
.modal-body { padding: 16px 20px 24px; }
.player-modal-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
  font-size: 26px; color: var(--txt); text-transform: uppercase;
  line-height: 1; margin-bottom: 2px;
}
.player-modal-meta {
  display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
}
.section-title {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--txt-dim); margin: 20px 0 10px;
  display: flex; align-items: center; gap: 6px;
}
.section-title::after {
  content: ""; flex: 1; height: 1px; background: var(--border);
}

/* ── ATTRIBUTE BARS ─────────────────────────────────────── */
.attr-row {
  display: grid; grid-template-columns: 100px 1fr 36px; align-items: center;
  gap: 10px; margin-bottom: 8px;
}
.attr-label {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
  font-size: 13px; letter-spacing: .5px; color: var(--txt-mid); text-transform: uppercase;
}
.attr-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.attr-bar-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }
.attr-val {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px;
  text-align: right;
}

/* ── STAT CHIPS ─────────────────────────────────────────── */
.stat-chips { display: flex; gap: 10px; flex-wrap: wrap; }
.stat-chip {
  background: var(--bg); border-radius: 8px; padding: 10px 14px; text-align: center; flex: 1;
}
.stat-chip-num {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px;
  color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums;
}
.stat-chip-lbl {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px;
  letter-spacing: 1.5px; color: var(--txt-dim); text-transform: uppercase; margin-top: 2px;
}

/* ── EVALUATIONS ────────────────────────────────────────── */
.eval-avg {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.eval-avg-num {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px;
  color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums;
}
.eval-avg-stars { font-size: 18px; }
.eval-avg-count { font-size: 12px; color: var(--txt-dim); }
.eval-btn {
  width: 100%; padding: 11px; border-radius: 8px;
  background: var(--navy); color: #fff; border: none;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 14px; transition: background .15s;
}
.eval-btn:hover { background: var(--navy-mid); }
.eval-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
.eval-item {
  background: var(--bg); border-radius: 8px; padding: 10px 12px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
}
.eval-author { font-weight: 600; font-size: 13px; color: var(--txt); }
.eval-comment { font-size: 12px; color: var(--txt-mid); margin-top: 2px; }
.eval-stars { font-size: 13px; color: var(--gold); white-space: nowrap; flex-shrink: 0; }

/* ── EVAL FORM MODAL ────────────────────────────────────── */
.eval-form { padding: 24px 20px; }
.eval-form h2 {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px;
  text-transform: uppercase; margin: 0 0 4px;
}
.eval-player-name { font-size: 13px; color: var(--gold); font-weight: 600; margin-bottom: 20px; }
.form-label {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--txt-dim); margin-bottom: 6px; display: block;
}
.form-input {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; background: var(--bg); color: var(--txt);
  font-family: 'Barlow', sans-serif; font-size: 14px; outline: none;
  transition: border-color .15s; margin-bottom: 14px;
}
.form-input:focus { border-color: var(--navy); }
.star-picker { display: flex; gap: 6px; margin-bottom: 14px; }
.star-btn {
  font-size: 28px; background: none; border: none; color: var(--border);
  transition: color .1s, transform .1s; padding: 0; line-height: 1;
}
.star-btn.on { color: var(--gold); }
.star-btn:hover { transform: scale(1.2); }
.form-submit {
  width: 100%; padding: 12px; border-radius: 8px;
  background: var(--navy); color: #fff; border: none;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase;
  transition: background .15s;
}
.form-submit:hover { background: var(--navy-mid); }
.form-submit:disabled { opacity: .5; cursor: default; }
.form-error { font-size: 12px; color: #c04020; margin-top: -10px; margin-bottom: 10px; }

/* ── ADMIN LOGIN MODAL ───────────────────────────────────── */
.admin-login-form { padding: 32px 24px; text-align: center; }
.admin-login-form h2 {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
  font-size: 24px; text-transform: uppercase; margin: 0 0 4px;
}
.admin-login-form p { font-size: 13px; color: var(--txt-dim); margin: 0 0 24px; }

/* ── ADMIN PANEL ─────────────────────────────────────────── */
#view-admin { display: none; min-height: 100dvh; }
#view-admin.active { display: block; }
.admin-header {
  background: var(--navy); padding: 14px max(16px, env(safe-area-inset-left,0px));
  display: flex; align-items: center; gap: 12px;
}
.admin-header h1 {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
  font-size: 20px; color: #fff; text-transform: uppercase; letter-spacing: .5px;
  margin: 0; flex: 1;
}
.admin-tabs {
  display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; gap: 0;
}
.admin-tab {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
  padding: 14px 18px; border: none; background: none; color: var(--txt-dim);
  border-bottom: 3px solid transparent; white-space: nowrap;
  transition: color .15s, border-color .15s;
}
.admin-tab.active { color: var(--navy); border-bottom-color: var(--navy); }
.admin-tab-content { display: none; padding: 20px max(16px, env(safe-area-inset-left,0px)); }
.admin-tab-content.active { display: block; }

/* ── ADMIN TABLE ─────────────────────────────────────────── */
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th {
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--txt-dim); font-weight: 700;
  padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left;
}
.admin-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tr:hover td { background: var(--bg); }
.tbl-actions { display: flex; gap: 6px; }
.btn-sm {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 6px; border: 1.5px solid var(--border);
  background: none; color: var(--txt-mid); transition: all .15s;
}
.btn-sm:hover { border-color: var(--navy); color: var(--navy); background: rgba(26,45,90,.06); }
.btn-sm.danger:hover { border-color: #c04020; color: #c04020; background: rgba(192,64,32,.06); }

/* ── WEEKLY UPDATE TABLE ─────────────────────────────────── */
.week-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.week-table th {
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--txt-dim); font-weight: 700;
  padding: 8px 10px; border-bottom: 2px solid var(--border); text-align: center;
  white-space: nowrap;
}
.week-table th:first-child { text-align: left; }
.week-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; }
.week-table td:first-child { text-align: left; }
.week-table tr.absent td { opacity: .4; }
.week-table tr:last-child td { border-bottom: none; }
.inline-star { font-size: 16px; cursor: pointer; color: var(--border); }
.inline-star.on { color: var(--gold); }
.pres-cb { width: 18px; height: 18px; cursor: pointer; accent-color: var(--navy); }

/* ── EDIT PLAYER FORM ────────────────────────────────────── */
.edit-form { max-width: 460px; }
.edit-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.edit-form .form-group { margin-bottom: 14px; }
.attr-slider { width: 100%; accent-color: var(--navy); }
.attr-slider-row {
  display: grid; grid-template-columns: 100px 1fr 44px; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.attr-preview {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px;
  text-align: center; min-width: 32px;
}
.photo-upload-wrap { border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; }
.photo-upload-wrap:hover { border-color: var(--navy); }
.photo-preview { width: 100px; height: 140px; object-fit: cover; border-radius: 8px; margin: 10px auto 0; display: block; }

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase;
  padding: 11px 22px; border-radius: 8px; border: none; cursor: pointer;
  transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-mid); }
.btn-primary:disabled { opacity: .5; cursor: default; }
.btn-secondary { background: var(--bg); color: var(--txt-mid); border: 1.5px solid var(--border); }
.btn-secondary:hover { border-color: var(--navy); color: var(--navy); }
.btn-danger { background: #c04020; color: #fff; }
.btn-danger:hover { background: #a03010; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: var(--gold-lt); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

/* ── TOAST ───────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: max(20px, env(safe-area-inset-bottom,0px)); left: 50%;
  transform: translateX(-50%) translateY(80px); background: var(--navy); color: #fff;
  padding: 12px 20px; border-radius: 24px; font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 14px; letter-spacing: 1px; white-space: nowrap;
  z-index: 999; transition: transform .3s ease; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: #206040; }
.toast.error { background: #802010; }

/* ── SIGN-IN PROMPT ─────────────────────────────────────── */
.signin-prompt {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px;
  padding: 20px; text-align: center; margin: 20px max(16px, env(safe-area-inset-left,0px));
  font-size: 14px; color: var(--txt-mid);
}

/* ── SPINNER ─────────────────────────────────────────────── */
.spinner {
  width: 24px; height: 24px; border: 3px solid var(--border);
  border-top-color: var(--navy); border-radius: 50%; animation: spin .6s linear infinite;
  margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── LOADING OVERLAY ─────────────────────────────────────── */
.loading-overlay {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 60px 20px; color: var(--txt-dim); font-size: 13px;
  font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px;
}
</style>
</head>

// ── Week helpers ─────────────────────────────────────────
function weekKey(d = new Date()) {
  const dt = new Date(d);
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() + 4 - (dt.getDay()||7));
  const ys = new Date(dt.getFullYear(),0,1);
  const wn = Math.ceil((((dt-ys)/86400000)+1)/7);
  return `${dt.getFullYear()}-S${String(wn).padStart(2,'0')}`;
}
function weekLabel(key) {
  if (!key) return '';
  const parts = key.split('-S');
  return `Semana ${parts[1]} · ${parts[0]}`;
}

// ── Helpers ───────────────────────────────────────────────
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function posColor(pos) {
  return ({GK:'#c8980a',ZAG:'#7030c0',LAT:'#2060c8',MEI:'#20a060','MEI-DE':'#1070a0','MEI-OF':'#c86820',ATA:'#c04020'})[pos]||'#3a5570';
}
function posLabel(pos) {
  return ({GK:'Goleiro',ZAG:'Zagueiro',LAT:'Lateral',MEI:'Meia','MEI-DE':'Meia Def.','MEI-OF':'Meia Of.',ATA:'Atacante'})[pos]||pos||'Meia';
}
function statColor(v) {
  if (v>=90) return '#ff9418';
  if (v>=80) return '#c9a228';
  if (v>=70) return '#3080d0';
  if (v>=60) return '#5a7a9a';
  return '#8891a8';
}
function starsText(r, n=5) {
  const f = Math.round(r||0);
  return Array.from({length:n},(_,i)=>i<f?'★':'☆').join('');
}
function avg(arr) { return arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : 0; }
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show'+(type?' '+type:'');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className='toast'; },2800);
}

// ── Load all data ─────────────────────────────────────────
async function loadData() {
  document.getElementById('squadContent').innerHTML =
    '<div class="loading-overlay"><div class="spinner"></div>Carregando elenco…</div>';

  try {
    const [pSnap, eSnap, cSnap] = await Promise.all([
      db.collection('players').get(),
      db.collection('evaluations').get(),
      db.collection('config').get(),
    ]);

    players = pSnap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
    evaluations = eSnap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));

    const cfgDoc = cSnap.docs.find(d=>d.id==='settings');
    configDoc = (cfgDoc?.exists ? cfgDoc.data() : null) || {password:DEFAULT_PASSWORD};

    renderSquad();
  } catch(e) {
    console.error(e);
    document.getElementById('squadContent').innerHTML =
      '<div class="loading-overlay">Erro ao carregar dados. Tente recarregar a página.</div>';
  }
}

// ── Monthly rating (last 4 weeks present+rated) ───────────
function monthlyRating(playerId) {
  const p = players.find(x=>x.id===playerId);
  if (!p?.entries) return 0;
  const rated = p.entries.filter(e=>e.present&&e.rating>0).slice(-4);
  if (!rated.length) return 0;
  return avg(rated.map(e=>e.rating));
}

// ── Presence rate ─────────────────────────────────────────
function presenceRate(playerId) {
  const allEntries = players.flatMap(p=>p.entries||[]);
  const weeks = [...new Set(allEntries.map(e=>e.week))];
  if (!weeks.length) return 0;
  const p = players.find(x=>x.id===playerId);
  const present = (p?.entries||[]).filter(e=>e.present).length;
  return Math.round(present/weeks.length*100);
}

// ── Community eval average ────────────────────────────────
function communityAvg(playerId) {
  const ev = evaluations.filter(e=>e.playerId===playerId);
  if (!ev.length) return {avg:0,count:0};
  return {avg:avg(ev.map(e=>e.rating)), count:ev.length};
}

// ── RENDER SQUAD ──────────────────────────────────────────
let filterPos = '';
let filterSearch = '';

function renderSquad() {
  const content = document.getElementById('squadContent');
  if (!players.length) {
    content.innerHTML =
      `<div class="empty-state">
        <strong>Nenhum jogador cadastrado</strong>
        Acesse o painel admin para adicionar os atletas.
      </div>`;
    return;
  }

  const filtered = players.filter(p=>{
    if (filterPos && p.position!==filterPos) return false;
    if (filterSearch && !p.name.toLowerCase().includes(filterSearch.toLowerCase())) return false;
    return true;
  });

  if (!filtered.length) {
    content.innerHTML = '<div class="empty-state"><strong>Nenhum resultado</strong>Tente outro filtro.</div>';
    return;
  }

  // Group by position
  const groups = filterPos ? {[filterPos]:filtered} : {};
  if (!filterPos) {
    for (const pos of ['GK','ZAG','LAT','MEI','ATA']) {
      const g = filtered.filter(p=>p.position===pos);
      if (g.length) groups[pos]=g;
    }
    // any without matching position
    const others = filtered.filter(p=>!POSITIONS.includes(p.position));
    if (others.length) groups['Outros']=others;
  }

  const posName = {GK:'Goleiros',ZAG:'Zagueiros',LAT:'Laterais',MEI:'Meias',ATA:'Atacantes',Outros:'Outros'};
  let html = '';
  for (const [pos, list] of Object.entries(groups)) {
    if (!filterPos) html += `<div class="position-section">
      <div class="position-label">${posName[pos]||pos} <span style="color:var(--txt-dim);font-size:11px;font-weight:400;">${list.length}</span></div>
    </div>`;
    html += `<div class="cards-grid">` + list.map(p=>cardHTML(p)).join('') + `</div>`;
  }

  content.innerHTML = html;
  document.getElementById('footerLabel').textContent =
    `${players.length} atleta${players.length!==1?'s':''} · Pelada Toque de Classe · 06/02/2019`;

  // Attach photo error handlers
  content.querySelectorAll('img.card-photo').forEach(img=>{
    img.addEventListener('error',()=>img.classList.add('hidden-img'));
  });

  content.querySelectorAll('.player-card').forEach(card=>{
    card.addEventListener('click',()=>openPlayer(card.dataset.id));
  });
}

function attrAvg(p) {
  const a = p.attributes || {};
  const vals = [a.passe, a.chute, a.defesa, a.ataque, a.fisico].filter(v => v !== undefined && v !== null);
  if (!vals.length) return 0;
  return Math.round(vals.reduce((s,v)=>s+v,0) / vals.length);
}

function cardHTML(p) {
  const rating = monthlyRating(p.id);
  const pct = presenceRate(p.id);
  const comm = communityAvg(p.id);
  const col = posColor(p.position);
  const photoSrc = p.photo||'';
  const posStyle = `background:${col}22;color:${col};border:1px solid ${col}55;`;
  const avg = attrAvg(p);
  const isElite = avg >= 90;

  const hasPhoto = !!photoSrc;
  const photoEl = hasPhoto
    ? `<img class="card-photo" src="${photoSrc}" alt="${p.name}" loading="lazy">`
    : `<div class="card-photo-placeholder">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>`;

  const stars = rating > 0 ? `<span style="color:var(--gold);font-size:11px;">${starsText(rating,5)}</span>` : '';
  const commEl = comm.count > 0 ? `<span style="font-size:10px;color:rgba(255,255,255,.55);">👥${comm.avg.toFixed(1)}</span>` : '';
  const scoreBadge = avg > 0 ? `<div class="score-badge${isElite?' elite':''}">${avg}</div>` : '';

  return `<div class="player-card${isElite?' elite-card':''}" data-id="${p.id}">
    ${photoEl}
    ${scoreBadge}
    <div class="card-overlay">
      <div class="card-name">${p.name}</div>
      <div class="card-bottom">
        <span class="pos-pill" style="${posStyle}">${p.position||'MEI'}</span>
        ${stars || commEl}
      </div>
      ${pct > 0 ? `<div class="card-presence">${pct}% presença</div>` : ''}
    </div>
  </div>`;
}

// ── OPEN PLAYER DETAIL ────────────────────────────────────
function openPlayer(id) {
  const p = players.find(x=>x.id===id);
  if (!p) return;
  activePlayerId = id;

  const rating = monthlyRating(id);
  const pct = presenceRate(id);
  const comm = communityAvg(id);
  const col = posColor(p.position);
  const ev = evaluations.filter(e=>e.playerId===id).slice().reverse().slice(0,15);

  const photoEl = p.photo
    ? `<img class="player-modal-photo" src="${p.photo}" alt="${p.name}">`
    : `<div class="player-modal-photo-placeholder">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="0.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>`;

  const attrsHTML = ATTRS.map(key=>{
    const val = (p.attributes||{})[key]||0;
    const col2 = statColor(val);
    return `<div class="attr-row">

function openEvalModal() {
  const p = players.find(x=>x.id===activePlayerId);
  if (!p) return;
  evalRating = 0;
  document.getElementById('evalPlayerName').textContent = p.name;
  document.getElementById('evalName').value = '';
  document.getElementById('evalComment').value = '';
  document.getElementById('evalError').hidden = true;
  document.getElementById('evalSubmit').disabled = false;
  updateStarPicker(0);
  document.getElementById('modalEval').hidden = false;
}

function updateStarPicker(r) {
  evalRating = r;
  document.querySelectorAll('#starPicker .star-btn').forEach((b,i)=>{
    b.classList.toggle('on', i<r);
  });
}

document.querySelectorAll('#starPicker .star-btn').forEach(b=>{
  b.addEventListener('click',()=>updateStarPicker(+b.dataset.v));
});

document.getElementById('evalSubmit').addEventListener('click', async ()=>{
  const name = document.getElementById('evalName').value.trim();
  const comment = document.getElementById('evalComment').value.trim();
  const errEl = document.getElementById('evalError');

  if (!name) { errEl.textContent='Por favor, informe seu nome.'; errEl.hidden=false; return; }
  if (!evalRating) { errEl.textContent='Por favor, dê uma nota de 1 a 5 estrelas.'; errEl.hidden=false; return; }
  if (!db) { errEl.textContent='Banco de dados indisponível.'; errEl.hidden=false; return; }

  errEl.hidden=true;
  const submitBtn = document.getElementById('evalSubmit');
  submitBtn.disabled=true; submitBtn.textContent='Enviando…';

  try {
    const id = uid();
    const data = {playerId:activePlayerId, authorName:name, rating:evalRating, comment, ts:Date.now()};
    await db.collection('evaluations').doc(id).set(data);
    evaluations.push({id,...data});
    document.getElementById('modalEval').hidden=true;
    // Refresh player detail
    openPlayer(activePlayerId);
    toast('Avaliação enviada! Obrigado.','success');
  } catch(e) {
    submitBtn.disabled=false; submitBtn.textContent='Enviar Avaliação';
    errEl.textContent='Erro ao salvar. Tente novamente.'; errEl.hidden=false;
  }
});

let editPhotoData = null;
let editingId = null;

function renderEditForm(id) {
  editingId = id;
  editPhotoData = null;
  const p = id ? players.find(x=>x.id===id) : null;
  const attrs = p?.attributes || DEFAULT_ATTRS;
  const el = document.getElementById('editForm');

  el.innerHTML=`
    <h3 style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;text-transform:uppercase;margin:0 0 20px;">
      ${p?'Editar: '+p.name:'Novo Jogador'}
    </h3>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="efName">Nome *</label>
        <input class="form-input" id="efName" type="text" value="${p?.name||''}" maxlength="40">
      </div>
      <div class="form-group">
        <label class="form-label" for="efPos">Posição</label>
        <select class="form-input" id="efPos" style="appearance:auto;">
          ${POSITIONS.map(pos=>`<option value="${pos}"${(p?.position||'MEI')===pos?' selected':''}>${pos} · ${posLabel(pos)}</option>`).join('')}
        </select>
      </div>
    </div>

    <label class="form-label">Foto do Jogador</label>
    <div class="photo-upload-wrap" id="photoUploadWrap" onclick="document.getElementById('photoFileInput').click()">
      ${p?.photo?`<img class="photo-preview" id="photoPreview" src="${p.photo}" alt="">`
        :`<div>📷 Clique para selecionar uma foto</div>`}
      <div style="font-size:11px;color:var(--txt-dim);margin-top:6px;">JPG, PNG até 5MB · será redimensionada automaticamente</div>
    </div>
    <input type="file" id="photoFileInput" accept="image/*" style="display:none">

    <div class="section-title" style="margin:20px 0 12px;">Atributos</div>
    ${ATTRS.map(key=>`<div class="attr-slider-row">
      <div class="attr-label">${ATTR_LABELS[key]}</div>
      <input type="range" class="attr-slider" id="sl_${key}" min="1" max="99" value="${attrs[key]||70}" oninput="syncSlider('${key}')">
      <div class="attr-preview" id="pv_${key}" style="color:${statColor(attrs[key]||70)}">${attrs[key]||70}</div>
    </div>`).join('')}

    <div class="btn-row">
      <button class="btn btn-primary" id="savePlayerBtn" onclick="savePlayer()">
        ${p?'💾 Salvar Alterações':'✚ Adicionar Jogador'}
      </button>
      ${p?`<button class="btn btn-secondary" onclick="renderEditForm(null)">Novo</button>`:''}
    </div>
    <div id="editFormMsg" style="margin-top:10px;font-size:13px;"></div>
  `;

  // Photo upload handler
  document.getElementById('photoFileInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      // Compress via canvas
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const MAX = 500;
        let w=img.width, h=img.height;
        if (w>h) { if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} }
        else { if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        editPhotoData = canvas.toDataURL('image/jpeg',0.75);
        // Show preview
        const wrap=document.getElementById('photoUploadWrap');
        let prev=document.getElementById('photoPreview');
        if(!prev) { prev=document.createElement('img'); prev.id='photoPreview'; prev.className='photo-preview'; wrap.prepend(prev); }
        prev.src=editPhotoData;
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function syncSlider(key) {
  const v = +document.getElementById('sl_'+key).value;
  const pv = document.getElementById('pv_'+key);
  pv.textContent = v; pv.style.color = statColor(v);
}

async function savePlayer() {
  if (!db) return;
  const name = document.getElementById('efName').value.trim();
  const pos = document.getElementById('efPos').value;
  const msgEl = document.getElementById('editFormMsg');
  if (!name) { msgEl.textContent='⚠ Informe o nome do jogador.'; msgEl.style.color='var(--pos-ata)'; return; }

  const attrs = {};
  ATTRS.forEach(k=>{ attrs[k]=+document.getElementById('sl_'+k).value; });

  const existing = editingId ? players.find(x=>x.id===editingId) : null;
  const id = editingId || uid();
  const photo = editPhotoData || existing?.photo || null;
  const entries = existing?.entries || [];

  const data = {name,position:pos,photo,attributes:attrs,entries,createdAt:existing?.createdAt||Date.now()};

  document.getElementById('savePlayerBtn').disabled=true;
  msgEl.textContent='Salvando…'; msgEl.style.color='var(--txt-dim)';

  try {
    await db.collection('players').doc(id).set(data);
    if (editingId) {
      const idx=players.findIndex(x=>x.id===editingId);
      if(idx>=0) players[idx]={id,...data};
    } else {
      players.push({id,...data});
    }
    msgEl.textContent='✔ Salvo com sucesso!'; msgEl.style.color='var(--pos-mei)';
    document.getElementById('savePlayerBtn').disabled=false;
    renderAdminPlayers();
    if (!editingId) renderEditForm(null);
    else editingId=id;
    toast('Jogador salvo!','success');
  } catch(e) {
    msgEl.textContent='Erro ao salvar: '+e.message; msgEl.style.color='var(--pos-ata)';
    document.getElementById('savePlayerBtn').disabled=false;
  }
}

async function deletePlayer(id) {
  const p=players.find(x=>x.id===id);
  if (!p||!db) return;
  if (!confirm(`Excluir ${p.name}? Esta ação não pode ser desfeita.`)) return;
  try {
    await db.collection('players').doc(id).delete();
    players=players.filter(x=>x.id!==id);
    evaluations=evaluations.filter(e=>e.playerId!==id);
    renderAdminPlayers();
    toast('Jogador excluído.','success');
  } catch(e){ toast('Erro ao excluir.','error'); }
}

let currentWeek = weekKey();

function renderWeekUpdate() {
  const el = document.getElementById('weekUpdateForm');
  if (!players.length) {
    el.innerHTML='<div class="empty-state"><strong>Sem jogadores</strong>Cadastre os atletas primeiro.</div>'; return;
  }

  // Collect all weeks from entries
  const allWeeks = [...new Set(players.flatMap(p=>(p.entries||[]).map(e=>e.week)))].sort().reverse();

  // Build initial state from current week entries
  const getEntry = (p) => (p.entries||[]).find(e=>e.week===currentWeek)||{present:false,rating:0};

  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
      <div>
        <label class="form-label" for="weekSel" style="margin:0 0 4px;">Semana</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <select class="form-input" id="weekSel" style="appearance:auto;width:auto;margin:0;">
            <option value="${currentWeek}">${weekLabel(currentWeek)} (atual)</option>
            ${allWeeks.filter(w=>w!==currentWeek).slice(0,12).map(w=>`<option value="${w}">${weekLabel(w)}</option>`).join('')}
          </select>
          <button class="btn btn-secondary" style="padding:8px 14px;font-size:12px;" onclick="markAllPresent(true)">Todos ✔</button>
          <button class="btn btn-secondary" style="padding:8px 14px;font-size:12px;" onclick="markAllPresent(false)">Nenhum ✗</button>
        </div>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table class="week-table" id="weekTbl">
        <thead><tr>
          <th>Jogador</th>
          <th>Presença</th>
          <th>Nota (1-5 ★)</th>
        </tr></thead>
        <tbody id="weekTbody">
          ${players.map(p=>{
            const e=getEntry(p);
            return `<tr id="wrow_${p.id}" class="${e.present?'':'absent'}">
              <td style="font-weight:600;">${p.name}</td>
              <td><input type="checkbox" class="pres-cb" id="pres_${p.id}" ${e.present?'checked':''} onchange="togglePresence('${p.id}')"></td>
              <td>
                <div style="display:flex;gap:2px;" id="stars_${p.id}">
                  ${[1,2,3,4,5].map(v=>`<span class="inline-star${v<=(e.rating||0)?' on':''}" data-pid="${p.id}" data-v="${v}" onclick="setWeekRating('${p.id}',${v})">★</span>`).join('')}
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveWeek()">💾 Salvar Semana</button>
    </div>
    <div id="weekMsg" style="margin-top:10px;font-size:13px;"></div>
  `;

  document.getElementById('weekSel').addEventListener('change', function(){
    currentWeek=this.value; renderWeekUpdate();
  });
}

function togglePresence(pid) {
  const cb=document.getElementById('pres_'+pid);
  const row=document.getElementById('wrow_'+pid);
  row.className=cb.checked?'':'absent';
}

function markAllPresent(val) {
  players.forEach(p=>{
    const cb=document.getElementById('pres_'+p.id);
    if(cb){ cb.checked=val; document.getElementById('wrow_'+p.id).className=val?'':'absent'; }
  });
}

function setWeekRating(pid, v) {
  document.querySelectorAll(`#stars_${pid} .inline-star`).forEach((s,i)=>{
    s.classList.toggle('on', i<v);
  });
}

async function saveWeek() {
  if (!db) return;
  const msgEl=document.getElementById('weekMsg');
  msgEl.textContent='Salvando…'; msgEl.style.color='var(--txt-dim)';

  try {
    // Build entries for each player
    const updates=[];
    for (const p of players) {
      const cb=document.getElementById('pres_'+p.id);
      if (!cb) continue;
      const present=cb.checked;
      const starEls=document.querySelectorAll(`#stars_${p.id} .inline-star`);
      let rating=0;
      starEls.forEach((s,i)=>{ if(s.classList.contains('on')) rating=i+1; });

      // Update entries array
      const entries=(p.entries||[]).filter(e=>e.week!==currentWeek);
      if (present||rating>0) entries.push({week:currentWeek,present,rating});
      p.entries=entries;

      // Save to db
      updates.push(db.collection('players').doc(p.id).update({entries}));
    }
    await Promise.all(updates);
    msgEl.textContent=`✔ Semana ${weekLabel(currentWeek)} salva!`; msgEl.style.color='var(--pos-mei)';
    toast('Semana salva!','success');
  } catch(e) {
    msgEl.textContent='Erro: '+e.message; msgEl.style.color='var(--pos-ata)';
    toast('Erro ao salvar.','error');
  }
}

  {name:'Paulinho',position:'MEI'},{name:'Paulinho PH',position:'MEI'},{name:'Rafa Leao',position:'MEI'},
  {name:'Sena',position:'MEI'},{name:'Thiago',position:'MEI'},{name:'Tiago Goleiro',position:'GK'},
  {name:'Vinicius Capa',position:'MEI'},{name:'Vinicius Lima',position:'MEI'},{name:'Weyber',position:'MEI'},
];

async function bulkLoad() {
  if (!db) return;
  if (!confirm(`Adicionar ${INITIAL_PLAYERS.length} atletas ao banco? Jogadores já existentes com o mesmo nome serão ignorados.`)) return;
  const btn=event.target; btn.disabled=true; btn.textContent='Carregando…';
  let added=0;
  try {
    for (const pl of INITIAL_PLAYERS) {
      const exists=players.some(p=>p.name.toLowerCase()===pl.name.toLowerCase());
      if (exists) continue;
      const id=uid();
      const data={name:pl.name,position:pl.position,photo:null,attributes:{...DEFAULT_ATTRS},entries:[],createdAt:Date.now()};
      await db.collection('players').doc(id).set(data);
      players.push({id,...data});
      added++;
    }
    renderAdminPlayers(); renderWeekUpdate();
    toast(`${added} atleta${added!==1?'s':''} adicionado${added!==1?'s':''}!`,'success');
  } catch(e){ toast('Erro ao carregar: '+e.message,'error'); }
  btn.disabled=false; btn.textContent='⚡ Carregar Elenco Inicial (41 atletas)';
}

<!-- MODAL: MONTAR TIMES -->
<div id="modal-times" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-hdr">
      <h2>⚽ Montar Times</h2>
      <button class="modal-close" onclick="closeTimesModal()">✕</button>
    </div>
    <div class="modal-body">
      <!-- Step 1: seleção -->
      <div id="times-step1">
        <div class="times-count" id="timesCount">0 jogadores selecionados</div>
        <div class="times-player-grid" id="timesPlayerGrid"></div>
        <div class="modal-actions">
          <button class="btn-escalar" id="btnEscalar" onclick="escalarTimes()" disabled>⚡ Escalar Times</button>
        </div>
      </div>
      <!-- Step 2: resultado -->
      <div id="times-step2" hidden>
        <div class="times-result" id="timesResult"></div>
        <div class="modal-actions">
          <button class="btn-reescalar" onclick="showTimesStep1()">← Alterar</button>
          <button class="btn-escalar" onclick="escalarTimes()">🔀 Reescalar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── MONTAR TIMES ──────────────────────────────────────────
let timesSelected = new Set();

function openTimesModal() {
  timesSelected = new Set();
  document.getElementById('modal-times').hidden = false;
  document.getElementById('times-step1').hidden = false;
  document.getElementById('times-step2').hidden = true;
  renderTimesPlayers();
}

function closeTimesModal() {
  document.getElementById('modal-times').hidden = true;
}

function renderTimesPlayers() {
  const sorted = [...players].sort((a,b) => attrAvg(b)-attrAvg(a));
  const grid = document.getElementById('timesPlayerGrid');
  grid.innerHTML = sorted.map(p => {
    const col = posColor(p.position);
    const score = attrAvg(p);
    const sel = timesSelected.has(p.id);
    return `<label class="times-player-row${sel?' selected':''}" onclick="toggleTimesPlayer('${p.id}',this)">
      <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation()">
      <span class="times-player-name">${p.name}</span>
      <span class="times-player-pos" style="background:${col}22;color:${col};border:1px solid ${col}55;">${p.position||'MEI'}</span>
      ${score>0?`<span class="times-player-score">${score}</span>`:''}
    </label>`;
  }).join('');
  updateTimesCount();
}

function toggleTimesPlayer(id, el) {
  if (timesSelected.has(id)) { timesSelected.delete(id); el.classList.remove('selected'); el.querySelector('input').checked=false; }
  else { timesSelected.add(id); el.classList.add('selected'); el.querySelector('input').checked=true; }
  updateTimesCount();
}

function updateTimesCount() {
  const n = timesSelected.size;
  document.getElementById('timesCount').textContent = `${n} jogador${n!==1?'es':''} selecionado${n!==1?'s':''}${n>22?' — máx 22!':''}`;
  const btn = document.getElementById('btnEscalar');
  btn.disabled = n < 2 || n > 22;
}

function showTimesStep1() {
  document.getElementById('times-step1').hidden = false;
  document.getElementById('times-step2').hidden = true;
}

function escalarTimes() {
  const sel = players.filter(p => timesSelected.has(p.id));
  if (sel.length < 2) return;

  // Grupos por posição
  const G = { GK:[], ZAG:[], LAT:[], 'MEI-DE':[], 'MEI-OF':[], MEI:[], ATA:[] };
  sel.forEach(p => {
    const pos = p.position||'MEI';
    (G[pos] || G['MEI']).push(p);
  });

  // MEI sem classificação → distribui entre MEI-DE e MEI-OF
  G['MEI'].sort((a,b)=>attrAvg(b)-attrAvg(a));
  G['MEI'].forEach((p,i) => i%2===0 ? G['MEI-DE'].push(p) : G['MEI-OF'].push(p));
  G['MEI'] = [];

  // Reordena cada grupo por score
  ['GK','ZAG','LAT','MEI-DE','MEI-OF','ATA'].forEach(k => G[k].sort((a,b)=>attrAvg(b)-attrAvg(a)));

  const teamA = [], teamB = [];

  // Snake draft: alterna vantagem por grupo para equilibrar
  const snake = (arr, startA) => {
    arr.forEach((p, i) => {
      const round = Math.floor(i/2);
      const isFirst = i%2===0;
      const goA = (round%2===0) ? (isFirst ? startA : !startA) : (isFirst ? !startA : startA);
      (goA ? teamA : teamB).push(p);
    });
  };

  snake(G['GK'],    true);
  snake(G['ZAG'],   true);
  snake(G['LAT'],   false);
  snake(G['MEI-DE'],true);
  snake(G['MEI-OF'],false);
  snake(G['ATA'],   true);

  renderTimesResult(teamA, teamB);
  document.getElementById('times-step1').hidden = true;
  document.getElementById('times-step2').hidden = false;
}

function renderTimesResult(teamA, teamB) {
  const totalA = teamA.reduce((s,p)=>s+attrAvg(p),0);
  const totalB = teamB.reduce((s,p)=>s+attrAvg(p),0);

  const renderTeam = (team, name, cls) => {
    const posOrder = ['GK','ZAG','LAT','MEI-DE','MEI-OF','MEI','ATA'];
    const sorted = [...team].sort((a,b)=>posOrder.indexOf(a.position||'MEI')-posOrder.indexOf(b.position||'MEI'));
    const total = team.reduce((s,p)=>s+attrAvg(p),0);
    const med = team.length ? Math.round(total/team.length) : 0;
    return `<div class="time-col ${cls}">
      <div class="time-header">
        <span>${name}</span>
        <span class="time-score-total">Média ${med}</span>
      </div>
      ${sorted.map(p=>{
        const col = posColor(p.position);
        const sc = attrAvg(p);
        return `<div class="time-player-item">
          <span class="time-player-item-name">${p.name}</span>
          <span class="time-player-item-pos" style="background:${col}22;color:${col};border:1px solid ${col}55;">${p.position||'MEI'}</span>
          ${sc>0?`<span class="time-player-item-score">${sc}</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  };

  document.getElementById('timesResult').innerHTML =
    renderTeam(teamA,'Time A','time-a') + renderTeam(teamB,'Time B','time-b');
}

// Fechar modal clicando fora
document.getElementById('modal-times').addEventListener('click', function(e){
  if (e.target === this) closeTimesModal();
});
</script>
